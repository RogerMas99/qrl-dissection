[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "qrl-dissection"
version = "0.1.0"
description = "Cross-algorithm (DQN/PPO) extension of the PQC-based QRL component dissection, with audited corrections to SimplyQRL"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }

# SimplyQRL is VENDORED at src/simplyqrl (revision b534cc9), matching the choice
# the paper's own companion repository makes and removing a git dependency that
# could resolve differently over time. It is byte-identical to upstream and to
# their copy; see src/simplyqrl/VENDORED.md. Corrections are never applied by
# editing it - they live in qrl_dissection/ and are applied at runtime.
#
# The pins below follow the upstream June 2025 lock - the environment that
# produced the published results - NOT the requirements.txt shipped with
# qrl-dissection, which pins autoray 0.8.0 and cannot import PennyLane.
# See docs/CORRECTIONS.md#fix-04
dependencies = [
    "gymnasium==1.1.1",
    "torch>=2.6,<3.0",
    "pennylane==0.41.1",
    "pennylane-lightning==0.41.1",
    "autoray==0.7.1",
    "numpy>=2.0",
    "tqdm",
    "tensorboard",
    "cloudpickle",
    "matplotlib",
    "pandas",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff"]

[tool.setuptools.packages.find]
where = ["src"]
include = ["qrl_dissection*", "simplyqrl*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = ["ignore::DeprecationWarning"]

[tool.ruff]
line-length = 100
target-version = "py310"
